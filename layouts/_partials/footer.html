<footer class="footer" id="footer">
  <div class="wrapper footer__grid">
    <div class="footer__item">
      <a class="footer__logo" href="{{ "/" | relURL }}">
        <img src="{{ "media/wzw_logo.svg" | relURL }}" alt="WoonZorgwijzer" width="314" height="82" loading="lazy">
      </a>
      <p class="footer__copyright">{{ site.Params.copyright }}</p>
    </div>
    <div class="footer__item">
      <h3 class="footer__heading">Meer</h3>
      <ul class="footer__list">
        {{- range site.Menus.footer }}
        <li><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </div>
  </div>
</footer>
